[project]
name = "ag-gazebo-bridge"
version = "0.2.0"
description = "FastMCP 3.4 bridge from Gazebo simulation to fleet robotics mesh"
authors = [
    { name = "Sandra Schipal", email = "sandraschipal@gmail.com" }
]
dependencies = [
    "fastmcp>=3.4.4,<4",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "prefab-ui>=0.14.0",
]
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "respx>=0.21.0",
    "ruff>=0.14.6",
]

[project.scripts]
ag-gazebo-bridge = "ag_gazebo_bridge.server:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ANN", "S", "PL", "RUF", "SIM", "TID", "T20"]
ignore = ["PLR0913", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ANN", "T20"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
