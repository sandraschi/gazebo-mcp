name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - run: uv run ruff check src/ web_sota/backend/
      - run: uv run ruff format --check src/ web_sota/backend/
      - run: uv run pytest -x --tb=short -k "not slow"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
        working-directory: web_sota
      - run: bunx tsc --noEmit
        working-directory: web_sota
      - run: bun run build
        working-directory: web_sota
